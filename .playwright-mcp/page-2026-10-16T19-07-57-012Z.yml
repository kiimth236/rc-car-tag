      - heading "꼭 지킬 규칙" [level=3] [ref=e163]
      - generic [ref=e164]: ① 선을 꽂거나 뺄 때는 항상 스위치 OFF. 켜진 채로 만지면 합선 한 번에 부품이 망가질 수 있습니다. ② USB 케이블을 ESP32에 꽂을 때는 P5 선(5V 레일 → ESP32 5V 핀)을 뽑습니다. PC의 5V와 L298N의 5V가 부딪치지 않게 하기 위해서입니다. GND 선(P6)은 그대로 둬도 됩니다. ③ 7.4V(배터리 전압)는 ESP32 핀에 절대 직접 닿으면 안 됩니다. ESP32 핀은 3.3V까지만 견딥니다. 배터리 측정은 반드시 분압 저항을 거칩니다 (7단계). ④ 그림에서 점(●)이 있는 곳만 연결입니다. 선이 반원(⌒)으로 넘어가거나 점 없이 겹치는 곳은 연결이 아닙니다.
      - generic [ref=e165]: "알아 두면 좋은 말 GND = 전기가 돌아가는 길(0V). 모든 부품의 GND가 서로 이어져 있어야 신호가 통합니다. PWM = 아주 빠르게 켰다 껐다 해서 \"평균 힘\"을 조절하는 방법. 켜진 비율(듀티)이 클수록 모터가 빨리 돕니다. 분압 = 저항 2개로 전압을 일정 비율로 낮추는 방법. 예: 100kΩ + 33kΩ이면 전압이 약 ¼로 줄어듭니다. 레일 = 브레드보드 가장자리의 긴 줄. 한 줄 전체가 안에서 이어져 있어서, 5V·GND를 여러 부품에 나눠 줄 때 씁니다."
