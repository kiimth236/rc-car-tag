; ---- 본 프로그램 (src/main.cpp 등) ----
[env:esp32dev]
; 이 PC에 설치된 버전으로 고정 → Arduino 코어 2.0.17 (ledcSetup / ledcAttachPin 방식)
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi·웹 화면·글꼴이 커서 저장 공간 확장 (앱 3MB, OTA 슬롯 1개)
board_build.partitions = huge_app.csv
; 점검용 코드(src/tests/)는 본 프로그램에 섞이지 않게 뺌
build_src_filter = +<*> -<.git/> -<.svn/> -<tests/>
lib_deps = links2004/WebSockets@2.6.1
; 폰 화면(web/)을 펌웨어에 넣음. txt 는 끝에 NUL 이 붙음
board_build.embed_txtfiles =
  web/index.html
  web/OFL.txt
board_build.embed_files = web/Galmuri11.woff2

; ---- 점검 프로그램 (src/tests/car1_test.cpp) ----
;   올리기 : pio run -e car1_test -t upload
;   보기   : pio device monitor -e car1_test
;   (USB 로 올릴 때는 5V 레일 → ESP32 5V 핀 선(P5)을 뽑으세요)
[env:car1_test]
extends = env:esp32dev
build_src_filter = -<*> +<tests/car1_test.cpp>
lib_ignore = WebSockets

; ---- 로직 테스트 (test/, ESP32 위에서 실행) ----
;   실행     : pio test -e logic_test            (ESP32 USB 연결 필요)
;   컴파일만 : pio test -e logic_test --without-uploading --without-testing
[env:logic_test]
extends = env:esp32dev
test_framework = unity
lib_ignore = WebSockets, rcar_hw
