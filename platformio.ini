; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---- 본 프로그램 (src/main.cpp 등) ----
[env:esp32dev]
; 이 PC에 설치된 버전으로 고정 → Arduino 코어 2.0.17 (ledcSetup / ledcAttachPin 방식, 설계서 6장)
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; BLE + ESP-NOW 코드가 커서 저장 공간 확장 (앱 3MB, OTA 슬롯 1개)
board_build.partitions = huge_app.csv
; 점검용 코드(src/tests/)는 본 프로그램에 섞이지 않게 뺌
build_src_filter = +<*> -<.git/> -<.svn/> -<tests/>

; ---- 1호차 하드웨어 점검 프로그램 (src/tests/car1_test.cpp) ----
;   올리기 : pio run -e car1_test -t upload
;   보기   : pio device monitor -e car1_test
;   (USB 로 올릴 때는 5V 레일 → ESP32 5V 핀 선(B4)을 뽑으세요)
[env:car1_test]
extends = env:esp32dev
build_src_filter = -<*> +<tests/car1_test.cpp>
