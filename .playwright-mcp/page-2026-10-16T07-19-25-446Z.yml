      - generic [ref=f2e1012]: "⚠ ENA·ENB 헤더는 핀이 2개씩 있습니다 (캡을 뺀 자리). 둘 중 하나는 L298N 내부 5V이고, 다른 하나가 ENA/ENB 입력입니다. 보드마다 위치가 달라서 멀티미터로 찾습니다: 스위치 ON, 검은 침은 GND 단자, 빨간 침으로 두 핀을 하나씩 재서 약 5V가 나오는 핀이 아닌 쪽에 점퍼선을 꽂습니다 (찾은 뒤 스위치 OFF). 5V 핀에 꽂으면 속도 조절이 안 되고 ESP32 핀에 5V가 걸립니다."
      - generic [ref=f2e1013]: 왜 바로 꽂아도 되나요? ESP32는 3.3V 신호를 내보내고, L298N은 약 2.3V보다 높으면 "켜짐(HIGH)"으로 알아듣습니다. 그래서 전압 변환 없이 바로 이어도 됩니다.
